# Temporary exceptions for versions already locked by npm that were published
# less than pnpm's default 24-hour minimum release age during this migration.
# Remove these entries after those versions have aged past that window.
minimumReleaseAgeExclude:
  - "@tailwindcss/node@4.3.5"
  - "@tailwindcss/oxide-android-arm64@4.3.5"
  - "@tailwindcss/oxide-darwin-arm64@4.3.5"
  - "@tailwindcss/oxide-darwin-x64@4.3.5"
  - "@tailwindcss/oxide-freebsd-x64@4.3.5"
  - "@tailwindcss/oxide-linux-arm-gnueabihf@4.3.5"
  - "@tailwindcss/oxide-linux-arm64-gnu@4.3.5"
  - "@tailwindcss/oxide-linux-arm64-musl@4.3.5"
  - "@tailwindcss/oxide-linux-x64-gnu@4.3.5"
  - "@tailwindcss/oxide-linux-x64-musl@4.3.5"
  - "@tailwindcss/oxide-wasm32-wasi@4.3.5"
  - "@tailwindcss/oxide-win32-arm64-msvc@4.3.5"
  - "@tailwindcss/oxide-win32-x64-msvc@4.3.5"
  - "@tailwindcss/oxide@4.3.5"
  - "@tailwindcss/vite@4.3.5"
  - tailwindcss@4.3.5
  - lucide-react@1.70.0

# @astrojs/astro2tsx@0.1.3 pins @emnapi/core@1.11.3 but omits the
# matching runtime from its published dependencies. Keep its WASM bridge pair
# aligned until the upstream package declares this dependency itself.
packageExtensions:
  "@astrojs/astro2tsx@0.1.3":
    dependencies:
      "@emnapi/runtime": 1.11.3
